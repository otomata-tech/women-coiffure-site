name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # La version de pnpm vient de "packageManager" dans package.json.
      # Ne PAS remettre `with: version`, sinon conflit ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # astro check (types + frontmatter Zod) puis build statique : attrape
      # frontmatter invalide, lien de collection cassé, erreur de génération.
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: dist
          path: dist
          retention-days: 7

  # Un push sur main = mise en ligne (ADR 0003) : le dist validé par le job
  # build est publié sur le projet Cloudflare Pages « women-coiffure ».
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=women-coiffure --branch=main --commit-hash=${{ github.sha }}
