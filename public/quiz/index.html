<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Quiz Trichologie Artemoda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Mobile-first, une carte par écran : en-tête de marque, carte question, barre d'action fixe en bas */
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --ink:#2C383A; --muted:#66777A; --line:#D9E2E1;
  --copper:#B76E22; --copper-soft:#F6E9DB; --sage:#8CA9AD; --sage-soft:#E3ECEC;
  --ok:#2F7D5B; --ok-soft:#DFF1E8; --ko:#B3413A; --ko-soft:#F8E3E1;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Figtree", "Avenir Next", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#182122; --surface:#222D2F; --ink:#EDF2F1; --muted:#A3B3B5; --line:#33413F;
  --copper:#D9934B; --copper-soft:#3A2C1E; --sage:#9DBABE; --sage-soft:#26393B;
  --ok:#6CC59C; --ok-soft:#1D3A2E; --ko:#E58A82; --ko-soft:#3E2523; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#182122; --surface:#222D2F; --ink:#EDF2F1; --muted:#A3B3B5; --line:#33413F;
  --copper:#D9934B; --copper-soft:#3A2C1E; --sage:#9DBABE; --sage-soft:#26393B;
  --ok:#6CC59C; --ok-soft:#1D3A2E; --ko:#E58A82; --ko-soft:#3E2523; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 120px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:800;letter-spacing:.14em;font-size:.78rem;color:var(--copper)}
.brand small{display:block;letter-spacing:.06em;font-weight:500;color:var(--muted);font-family:var(--body);font-size:.75rem;text-transform:none}
.prog{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);font-size:.9rem}
.bar{height:6px;background:var(--sage-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--copper);transition:width .35s ease}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.12}
h1{font-size:clamp(2rem,8vw,2.6rem);font-weight:800}
h2{font-size:clamp(1.35rem,5.6vw,1.65rem);font-weight:700}
.lead{color:var(--muted);margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:16px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.95rem}
input[type=text]{font:inherit;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--copper)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{font:inherit;font-weight:600;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.seg button[aria-pressed=true]{border-color:var(--copper);background:var(--copper-soft);color:var(--copper)}
.tag{align-self:flex-start;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sage);background:var(--sage-soft);padding:4px 10px;border-radius:99px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{font:inherit;text-align:left;display:flex;gap:12px;align-items:center;padding:15px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;font-weight:500}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;border:1.5px solid var(--line);color:var(--muted)}
.opt.sel{border-color:var(--copper);background:var(--copper-soft)}
.opt.sel .k{background:var(--copper);border-color:var(--copper);color:#fff}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.good .k{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--ko);background:var(--ko-soft)}
.opt.bad .k{background:var(--ko);border-color:var(--ko);color:#fff}
.opt:disabled{cursor:default}
.fb{border-radius:14px;padding:14px;font-size:.95rem}
.fb strong{display:block;font-family:var(--display);font-size:1.05rem;margin-bottom:2px}
.fb.ok{background:var(--ok-soft);color:var(--ink)} .fb.ok strong{color:var(--ok)}
.fb.ko{background:var(--ko-soft);color:var(--ink)} .fb.ko strong{color:var(--ko)}
.action{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);
  padding:28px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.action .in{max-width:560px;margin:0 auto}
.btn{width:100%;font:inherit;font-weight:700;font-size:1.05rem;padding:16px;border-radius:14px;border:0;background:var(--copper);color:#fff;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--copper);border:1.5px solid var(--copper)}
:focus-visible{outline:3px solid var(--sage);outline-offset:2px}
.score{display:flex;gap:20px;align-items:center}
.ring{flex:none;width:118px;height:118px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--copper) calc(var(--p)*1%),var(--sage-soft) 0)}
.ring b{width:92px;height:92px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-size:1.9rem;font-weight:800;font-variant-numeric:tabular-nums}
.level{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--copper);line-height:1.1}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:.72rem;text-align:center;color:var(--muted)}
.scale span{padding:6px 2px;border-radius:8px;background:var(--sage-soft)}
.scale span.on{background:var(--copper);color:#fff;font-weight:700}
.recap{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.recap li{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.recap li i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.75rem;color:#fff;margin-top:1px}
.recap li i.y{background:var(--ok)} .recap li i.n{background:var(--ko)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px;user-select:all;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row .btn{flex:1 1 200px}
.mail{font-weight:700;user-select:all;color:var(--ink)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duo div{background:var(--bg);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px}
.duo small{color:var(--muted);font-size:.78rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.duo b{font-family:var(--display);font-size:1.5rem;font-variant-numeric:tabular-nums}
.offer{display:flex;flex-direction:column;gap:10px}
.offer div{border:1.5px solid var(--line);border-radius:14px;padding:14px}
.offer div.top{border-color:var(--copper)}
.offer b{font-family:var(--display);font-size:1.4rem;color:var(--copper)}
.seg4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg4 button{font:inherit;font-weight:600;font-size:.9rem;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.seg4 button[aria-pressed=true]{border-color:var(--copper);background:var(--copper-soft);color:var(--copper)}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rate.tri{grid-template-columns:repeat(3,1fr)}
.rate button{font:inherit;font-weight:600;font-size:.85rem;padding:10px 4px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.rate button[aria-pressed=true]{border-color:var(--copper);background:var(--copper);color:#fff}
.item{display:flex;flex-direction:column;gap:8px;padding-block:6px;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item p{margin:0;font-weight:600;font-size:.95rem}
textarea{font:inherit;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);min-height:70px;resize:vertical}
.saved{border-radius:14px;padding:14px;background:var(--ok-soft)}
.saved.warn{background:var(--copper-soft)}
.saved strong{display:block;font-family:var(--display)}
.mail{font-weight:700;user-select:all}
.foot{font-size:.78rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">ARTEMODA GROUP<small>Formation Trichologie · Nathalie Laporte</small></div>
    <div class="prog" id="prog"></div>
  </header>
  <div class="bar" aria-hidden="true"><i id="barfill"></i></div>
  <main id="app"></main>
  <p class="foot">Autoévaluation · session DAVINES Paris · 9 &amp; 10 novembre 2026</p>
</div>
<div class="action"><div class="in" id="act"></div></div>

<script>
const Q=[
 {q:"Qu’est-ce qui empêche le cuir chevelu de se déshydrater ?",o:["La sueur seule","Le sébum","Les lavages fréquents"],a:[1],e:"Le sébum forme, avec la sueur, le film hydrolipidique : une barrière qui retient l’eau dans la peau. Des lavages trop fréquents l’éliminent et assèchent."},
 {q:"Qu’est-ce qui stimule la transpiration ?",o:["Les fortes émotions","L’alimentation","La pollution","Le climat chaud"],a:[0,1,3],e:"Émotions, alimentation et chaleur activent les glandes sudoripares. La pollution encrasse, mais ne fait pas transpirer."},
 {q:"Comment une hyperhidrose peut-elle provoquer des démangeaisons ?",o:["Par forte humidité","Par la chaleur excessive","Par la variation du pH"],a:[2],e:"La sueur en excès modifie le pH du cuir chevelu ; l’ammoniac et les chlorures irritent la peau."},
 {q:"La folliculite est causée par…",o:["Des démangeaisons","Des bactéries","Une astéatose"],a:[1],e:"C’est une infection, le plus souvent bactérienne, du follicule pileux."},
 {q:"Qu’est-ce que la trichodynie ?",o:["L’action de s’arracher les cheveux","Une forte transpiration","Une douleur du cuir chevelu"],a:[2],e:"Trichodynie = cuir chevelu douloureux, sensible au toucher. S’arracher les cheveux, c’est la trichotillomanie."},
 {q:"Une douleur du cuir chevelu avec des démangeaisons vous fait penser à…",o:["Une trichoptilose","Un problème de foie","Une éventuelle chute de cheveux"],a:[2],e:"Un cuir chevelu inflammé et douloureux annonce souvent une chute dans les semaines qui suivent."},
 {q:"Quelle est la phase la plus longue du cycle du cheveu ?",o:["Phase anagène","Phase catagène","Phase télogène"],a:[0],e:"L’anagène, la phase de croissance, dure de 2 à 7 ans. Le catagène dure environ 3 semaines, le télogène environ 3 mois."},
 {q:"Que provoque le chlorure de sodium (le sel de la sueur) ?",o:["Une déshydratation","Une séborrhée","Une chute de cheveux imminente"],a:[0],e:"Le sel attire l’eau hors de la peau : le cuir chevelu se déshydrate et tiraille."},
 {q:"Les pellicules…",o:["Touchent principalement les jeunes","Sont génétiques","Peuvent être causées par des facteurs métaboliques"],a:[2],e:"Stress, alimentation, hormones ou saison peuvent accélérer le renouvellement cellulaire et faire apparaître des pellicules."},
 {q:"En cas de pellicules, à quelle fréquence appliquer un shampooing spécifique ?",o:["Quotidiennement","1 à 2 fois par semaine","1 fois par mois"],a:[1],e:"1 à 2 fois par semaine, en alternance avec un shampooing doux, pour traiter sans agresser."},
 {q:"Où se trouvent les champignons et les bactéries ?",o:["Sur la peau, avec les pellicules","Sur les longueurs des cheveux sales","Uniquement sur la nuque"],a:[0],e:"Ils vivent sur la peau du cuir chevelu, où ils se nourrissent du sébum et des squames."},
 {q:"Que recommander pour un psoriasis, en cas de doute ?",o:["Un séborégulateur","Un peeling","Un hydratant"],a:[2],e:"On hydrate et on apaise, sans jamais gommer les plaques. Le traitement relève du dermatologue."},
 {q:"Quel est le traitement approprié pour un cuir chevelu enflammé ?",o:["Un traitement énergisant","Un traitement détox","Un traitement calmant, apaisant"],a:[2],e:"On calme d’abord l’inflammation. Énergisant et détox viennent plus tard, sur un cuir chevelu apaisé."},
 {q:"Le Pityrosporum est…",o:["Un crapaud en latin","La sortie du sébum","Un micro-organisme"],a:[2],e:"C’est une levure (Malassezia furfur) qui se nourrit du sébum et favorise les pellicules."},
 {q:"Une alopécie androgénétique est…",o:["Héréditaire et hormonale","Une chute passagère et réversible","Une chute de saison"],a:[0],e:"Elle est d’origine génétique et hormonale : les cheveux se miniaturisent peu à peu. On ralentit sa progression, on ne la guérit pas. La chute passagère, c’est l’effluvium."}
];
const LEVELS=[[0,"Découverte","Les bases sont à construire : ces deux jours sont faits pour vous."],[40,"Initié·e","Vous avez des repères. On va les structurer et les rendre utiles en cabine."],[65,"Confirmé·e","Solide ! Il reste quelques notions à affiner."],[85,"Expert·e","Excellent niveau. Vous pourrez épauler le groupe."]];
const $=s=>document.querySelector(s), app=$("#app"), act=$("#act");
const SESSION="Trichologie Artemoda · DAVINES Paris · 9-10/11/2026";
const ENDPOINT=""; // adresse du relais oto, renseignée par Alexis lors de la mise en ligne
const MAILTO="women.distrib@gmail.com"; // repli : envoi par e-mail tant que le relais n’est pas branché
const LABELS={id_stagiaire:"Identifiant",session:"Session",nom:"Nom",prenom:"Prénom",salon:"Salon",fonction:"Fonction",attentes:"Attentes",date_entree:"Date positionnement",niveau_ressenti:"Niveau ressenti",score_entree:"Score entrée (%)",niveau_entree:"Niveau entrée",objectifs_entree:"Objectifs (entrée)",date_sortie:"Date évaluation sortie",score_sortie:"Score sortie (%)",niveau_sortie:"Niveau sortie",progression:"Progression (points)",objectifs_sortie:"Objectifs (sortie)",date_satisfaction:"Date satisfaction",notes_satisfaction:"Notes satisfaction",satisfaction_moyenne:"Satisfaction moyenne (/4)",recommande:"Recommande",retient:"Retient",ameliorer:"Améliorerait",premier_geste:"Premier geste",recontact_suivi:"Recontact suivi"};
const OBJ=["Comprendre l’anatomie de la peau, du follicule et du cheveu, et le cycle pilaire","Repérer les anomalies du cuir chevelu et de la tige (questionnaire, pull test, micro-caméra)","Expliquer un diagnostic en mots simples et proposer une prescription salon + maison","Réaliser un modelage trichologique adapté à l’anomalie"];
const OBJV=["Non acquis","En cours","Acquis"];
const SAT=["Le contenu correspondait à mes attentes","Les objectifs annoncés ont été atteints","Clarté et expertise de la formatrice","Équilibre entre théorie et pratique","Qualité des supports (présentation, quiz)","Organisation : accueil, salle, horaires","Je peux appliquer ce que j’ai appris dès mon retour","Satisfaction globale"];
let S={step:"intro",nom:"",prenom:"",salon:"",fonction:"",attentes:"",moment:"Début de formation",felt:"",i:0,sel:[],answers:[],obj:[],sat:[],reco:"",retient:"",ameliorer:"",geste:"",recontact:"",sent:null};
function save(){try{localStorage.setItem("triquiz3",JSON.stringify(S))}catch(e){}}
try{const r=JSON.parse(localStorage.getItem("triquiz3")||"null");if(r&&r.step)S=Object.assign(S,r)}catch(e){}
function hist(){try{return JSON.parse(localStorage.getItem("triquiz_hist")||"{}")}catch(e){return{}}}
function setHist(k,v){try{const h=hist();h[k]=v;localStorage.setItem("triquiz_hist",JSON.stringify(h))}catch(e){}}
const isExit=()=>S.moment==="Fin de formation";
const eq=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const now=()=>new Date().toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"});
function score(){const c=S.answers.filter((x,k)=>eq(x,Q[k].a)).length;return{c,p:Math.round(c/Q.length*100)}}
function level(p){let L=LEVELS[0];LEVELS.forEach(l=>{if(p>=l[0])L=l});return L}
function setProg(){const n=S.step==="q"?S.i:S.step==="intro"?0:Q.length;$("#barfill").style.width=(n/Q.length*100)+"%";$("#prog").textContent=S.step==="q"?`${S.i+1} / ${Q.length}`:""}
function render(){setProg();({intro,q:question,end,sat:satisfaction,done})[S.step]();window.scrollTo(0,0)}
function seg(cls,vals,cur,attr){return `<div class="${cls}" role="group">${vals.map(m=>`<button type="button" data-${attr}="${esc(m)}" aria-pressed="${cur===m}">${esc(m)}</button>`).join("")}</div>`}
function field(id,label,val,ph,area){return `<label class="f" for="${id}">${label}${area?`<textarea id="${id}" placeholder="${ph}">${esc(val)}</textarea>`:`<input id="${id}" type="text" value="${esc(val)}" placeholder="${ph}">`}</label>`}
const idStag=()=>(SESSION+"|"+S.nom.trim().toUpperCase()+"|"+S.prenom.trim().toLowerCase());
async function send(data){
  const row=Object.assign({id_stagiaire:idStag(),session:SESSION,nom:S.nom.trim().toUpperCase(),prenom:S.prenom.trim(),salon:S.salon.trim()},data);
  S.lastRow=row;save();
  if(!ENDPOINT)return false;
  try{const r=await fetch(ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(row)});return r.ok}catch(e){return false}
}
function intro(){
  const exit=isExit();
  app.innerHTML=`<div class="card">
   <span class="tag">Autoévaluation</span>
   <h1>Où en êtes-vous en trichologie ?</h1>
   <p class="lead">${Q.length} questions, environ 5 minutes. Répondez seul·e, sans chercher. Votre score est pour vous ; vos réponses servent aussi de fiche d’évaluation officielle de la formation.</p>
   <div class="f" style="font-weight:600;font-size:.95rem">Moment ${seg("seg",["Début de formation","Fin de formation"],S.moment,"m")}</div>
   ${field("nom","Nom *",S.nom,"Votre nom de famille")}
   ${field("pre","Prénom *",S.prenom,"Votre prénom")}
   ${field("sl","Salon et ville",S.salon,"Ex. Salon Élégance, Lyon")}
   ${exit?"":field("fo","Fonction",S.fonction,"Ex. coiffeuse, manager, gérante")+field("at","Ce que j’attends de la formation",S.attentes,"En quelques mots",true)}
   ${exit?"":`<div class="f" style="font-weight:600;font-size:.95rem">Avant de commencer, comment vous situez-vous ?
     ${seg("seg4",LEVELS.map(l=>l[1]),S.felt,"l")}</div>`}
  </div>`;
  act.innerHTML=`<button class="btn" id="go">Commencer le quiz</button>`;
  const ok=()=>{$("#go").disabled=!($("#nom").value.trim()&&$("#pre").value.trim()&&(isExit()||S.felt))};
  app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{S.moment=b.dataset.m;keep();save();intro()});
  app.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{S.felt=b.dataset.l;app.querySelectorAll("[data-l]").forEach(x=>x.setAttribute("aria-pressed",x===b));ok()});
  const keep=()=>{S.nom=$("#nom").value;S.prenom=$("#pre").value;S.salon=$("#sl").value;if($("#fo")){S.fonction=$("#fo").value;S.attentes=$("#at").value}};
  app.querySelectorAll("input,textarea").forEach(x=>x.oninput=ok);ok();
  $("#go").onclick=()=>{keep();S.step="q";S.i=0;S.answers=[];S.sel=[];S.checked=false;S.obj=[];S.sent=null;save();render()};
}
function next(){if(S.i===Q.length-1)S.step="end";else{S.i++;S.sel=[];S.checked=false}save();render()}
function question(){
  const it=Q[S.i], multi=it.a.length>1, done=S.checked;
  app.innerHTML=`<div class="card">
   <span class="tag">${multi?"Plusieurs réponses possibles":"Une seule réponse"}</span>
   <h2>${esc(it.q)}</h2>
   <div class="opts">${it.o.map((o,k)=>{let c="";
      if(done){if(it.a.includes(k))c="good";else if(S.sel.includes(k))c="bad"}else if(S.sel.includes(k))c="sel";
      return `<button class="opt ${c}" data-k="${k}" ${done?"disabled":""} aria-pressed="${S.sel.includes(k)}"><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`}).join("")}</div>
   ${done?(()=>{const g=eq(S.sel,it.a);return `<div class="fb ${g?"ok":"ko"}" role="status"><strong>${g?"Bonne réponse":"Pas tout à fait"}</strong>${esc(it.e)}</div>`})():""}
  </div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const k=+b.dataset.k;
    if(multi)S.sel=S.sel.includes(k)?S.sel.filter(x=>x!==k):[...S.sel,k];else S.sel=[k];save();question()});
  const last=S.i===Q.length-1;
  if(!done){act.innerHTML=`<button class="btn" id="val" ${S.sel.length?"":"disabled"}>${isExit()?"Valider":(last?"Voir mon résultat":"Valider et continuer")}</button>`;
    $("#val").onclick=()=>{S.answers[S.i]=[...S.sel];if(isExit()){S.checked=true;save();question()}else next()}}
  else{act.innerHTML=`<button class="btn" id="nx">${last?"Voir mon résultat":"Question suivante"}</button>`;$("#nx").onclick=next}
}
function objBlock(){return `<div class="card"><h2>${isExit()?"Les objectifs, aujourd’hui":"Les objectifs de la formation"}</h2>
  <p class="lead" style="margin:0">Pour chaque objectif, où en êtes-vous ${isExit()?"maintenant":"avant de commencer"} ?</p>
  ${OBJ.map((o,k)=>`<div class="item"><p>${k+1}. ${esc(o)}</p><div class="rate tri" role="group">${OBJV.map(v=>`<button type="button" data-o="${k}" data-v="${v}" aria-pressed="${S.obj[k]===v}">${v}</button>`).join("")}</div></div>`).join("")}</div>`}
function wireObj(cb){app.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const k=+b.dataset.o;S.obj[k]=b.dataset.v;app.querySelectorAll(`[data-o="${k}"]`).forEach(x=>x.setAttribute("aria-pressed",x===b));save();cb()})}
const objStr=()=>OBJ.map((o,k)=>`O${k+1} : ${S.obj[k]||"—"}`).join(" ; ");
function end(){
  const{c,p}=score(),L=level(p),key=isExit()?"fin":"debut";setHist(key,p);const h=hist();
  const felt=LEVELS.findIndex(l=>l[1]===S.felt), real=LEVELS.indexOf(L);
  const gap=felt<0?"":felt===real?"Votre ressenti est juste : vous vous connaissez bien.":felt>real?"Vous vous situiez un peu plus haut : ces deux jours vont consolider vos bases.":"Vous en savez plus que vous ne le pensez : faites-vous confiance !";
  const prog=isExit()&&h.debut!=null?`<div class="duo"><div><small>Début</small><b>${h.debut} %</b></div><div><small>Fin</small><b>${p} %</b></div></div><p style="margin:0"><b>${p-h.debut>=0?"+":""}${p-h.debut} points</b> de progression en deux jours.</p>`:"";
  app.innerHTML=`<div class="card">
    <span class="tag">${esc(S.moment)}</span>
    <div class="score"><div class="ring" style="--p:${p}"><b>${p}%</b></div>
      <div><div class="lead">${esc(S.prenom)}, votre niveau</div><div class="level">${L[1]}</div><div class="lead">${c} bonnes réponses sur ${Q.length}</div></div></div>
    <div class="scale">${LEVELS.map((l,k)=>`<span class="${l===L?"on":""}">${l[1]}<br>${l[0]}${k<3?"–"+(LEVELS[k+1][0]-1):"–100"} %</span>`).join("")}</div>
    <p style="margin:0">${L[2]}</p>
  </div>
  ${isExit()?`<div class="card"><h2>Votre progression</h2>${prog||'<p class="lead" style="margin:0">Le score du début n’est pas sur ce téléphone : la formatrice le retrouvera dans la fiche d’évaluation.</p>'}</div>`
   :`<div class="card"><h2>Ressenti et réalité</h2><div class="duo"><div><small>Vous pensiez</small><b style="font-size:1.15rem">${esc(S.felt||"—")}</b></div><div><small>Le quiz dit</small><b style="font-size:1.15rem">${L[1]}</b></div></div><p style="margin:0">${gap}</p></div>`}
  ${objBlock()}
  ${isExit()?`<div class="card"><h2>Votre correction</h2>
    <ul class="recap">${Q.map((x,k)=>{const g=eq(S.answers[k]||[],x.a);return `<li><i class="${g?"y":"n"}">${g?"✓":"✕"}</i><span><b>${esc(x.q)}</b><br>Réponse : ${x.a.map(i=>esc(x.o[i])).join(" + ")}</span></li>`}).join("")}</ul></div>`
   :`<div class="card"><h2>Vos questions</h2><p class="lead" style="margin:0">Les bonnes réponses, on les découvre ensemble pendant la formation.</p>
    <ul class="recap">${Q.map((x,k)=>{const g=eq(S.answers[k]||[],x.a);return `<li><i class="${g?"y":"n"}">${g?"✓":"✕"}</i><span>${esc(x.q)}</span></li>`}).join("")}</ul></div>`}`;
  const ready=()=>OBJ.every((o,k)=>S.obj[k]);
  act.innerHTML=`<button class="btn" id="vo">${isExit()?"Continuer : mon avis sur la formation":"Valider mon positionnement"}</button>`;
  const upd=()=>{$("#vo").disabled=!ready()};upd();wireObj(upd);
  $("#vo").onclick=async()=>{
    if(isExit()){S.step="sat";save();render();return}
    $("#vo").disabled=true;$("#vo").textContent="Enregistrement…";
    const ok=await send({fonction:S.fonction.trim(),attentes:S.attentes.trim(),date_entree:now(),niveau_ressenti:S.felt,score_entree:p,niveau_entree:L[1],objectifs_entree:objStr()});
    S.sent=ok;S.step="done";save();render()};
}
function satisfaction(){
  app.innerHTML=`<div class="card"><span class="tag">Satisfaction</span><h2>Votre avis sur la formation</h2>
    <p class="lead" style="margin:0">1 = pas du tout satisfait·e, 4 = très satisfait·e.</p>
    ${SAT.map((t,k)=>`<div class="item"><p>${esc(t)}</p><div class="rate" role="group">${[1,2,3,4].map(n=>`<button type="button" data-s="${k}" data-n="${n}" aria-pressed="${S.sat[k]===n}">${n}</button>`).join("")}</div></div>`).join("")}
  </div>
  <div class="card">
    <div class="f" style="font-weight:600;font-size:.95rem">Recommanderiez-vous cette formation à un·e collègue ? ${seg("seg",["Oui","Non"],S.reco,"r")}</div>
    ${field("re","Ce que je retiens en priorité",S.retient,"",true)}
    ${field("am","Ce que j’améliorerais",S.ameliorer,"",true)}
    ${field("ge","Le premier geste que je mets en place en salon",S.geste,"",true)}
    <div class="f" style="font-weight:600;font-size:.95rem">Souhaitez-vous être recontacté·e pour le suivi (groupe de suivi, e-learning) ? ${seg("seg",["Oui","Non"],S.recontact,"c")}</div>
  </div>`;
  act.innerHTML=`<button class="btn" id="ok">Envoyer mon évaluation</button>`;
  const ready=()=>{$("#ok").disabled=!(SAT.every((t,k)=>S.sat[k])&&S.reco)};ready();
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const k=+b.dataset.s;S.sat[k]=+b.dataset.n;app.querySelectorAll(`[data-s="${k}"]`).forEach(x=>x.setAttribute("aria-pressed",x===b));save();ready()});
  app.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{S.reco=b.dataset.r;app.querySelectorAll("[data-r]").forEach(x=>x.setAttribute("aria-pressed",x===b));ready()});
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{S.recontact=b.dataset.c;app.querySelectorAll("[data-c]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  $("#ok").onclick=async()=>{
    S.retient=$("#re").value.trim();S.ameliorer=$("#am").value.trim();S.geste=$("#ge").value.trim();
    $("#ok").disabled=true;$("#ok").textContent="Enregistrement…";
    const{p}=score(),h=hist(),moy=Math.round(S.sat.reduce((a,b)=>a+b,0)/SAT.length*10)/10;
    const ok=await send({date_sortie:now(),score_sortie:p,niveau_sortie:level(p)[1],progression:h.debut!=null?p-h.debut:null,objectifs_sortie:objStr(),
      date_satisfaction:now(),notes_satisfaction:SAT.map((t,k)=>`${t} : ${S.sat[k]}`).join(" ; "),satisfaction_moyenne:moy,recommande:S.reco,retient:S.retient,ameliorer:S.ameliorer,premier_geste:S.geste,recontact_suivi:S.recontact||"Non précisé"});
    S.sent=ok;S.step="done";save();render()};
}
function mailHref(){const r=S.lastRow||{};const etape=isExit()?"Fin de formation":"Début de formation";
  const subj=`Évaluation Qualiopi Trichologie · ${r.nom||""} ${r.prenom||""} · ${etape}`;
  const body=Object.keys(r).filter(k=>r[k]!==null&&r[k]!==undefined&&r[k]!=="").map(k=>`${LABELS[k]||k} : ${r[k]}`).join("\n");
  return `mailto:${MAILTO}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(body)}`}
function done(){
  const exit=isExit(),{p}=score();
  app.innerHTML=`<div class="card"><span class="tag">${esc(S.moment)}</span>
    <h2>${exit?"Merci, votre évaluation est terminée":"Merci, votre positionnement est enregistré"}</h2>
    ${S.sent?`<div class="saved"><strong>Enregistré</strong>Vos réponses sont transmises à l’organisme de formation. Rien à imprimer, rien à signer.</div>`
      :`<div class="saved warn"><strong>Dernière étape : envoyez votre évaluation</strong>Touchez le bouton ci-dessous : votre messagerie s’ouvre avec l’évaluation déjà rédigée, il ne reste qu’à appuyer sur « Envoyer ». Adresse : <span class="mail">${MAILTO}</span></div>
      <a class="btn" style="text-align:center;text-decoration:none" href="${mailHref()}">Envoyer mon évaluation par e-mail</a>
      <p class="lead" style="margin:0;font-size:.85rem">Le bouton ne s’ouvre pas ? Montrez cet écran à votre formatrice : ${esc(S.prenom)} ${esc(S.nom.toUpperCase())} · ${esc(S.moment)} · score ${p} %.</p>`}
    ${exit?"":`<p style="margin:0">En fin de formation, rouvrez ce quiz sur ce même téléphone et choisissez « Fin de formation » pour mesurer votre progression.</p>`}
  </div>
  ${exit?`<div class="card"><span class="tag">Continuer à progresser</span><h2>La trichologie toute l’année</h2>
    <div class="offer"><div><small class="lead">Groupe de suivi · 12 mois</small><br><b>360 € HT / an</b><p class="lead" style="margin:4px 0 0">Soit 30 € HT par mois, le prix d’un soin. Inclus pour les membres Artemoda.</p></div>
    <div class="top"><small class="lead">Le plus complet · e-learning 20 h + suivi 12 mois</small><br><b>640 € HT</b><p class="lead" style="margin:4px 0 0">Le nouveau programme, à votre rythme, accompagnement inclus.</p></div></div>
    <p style="margin:0">Inscriptions auprès de Nathalie Laporte · @artemoda_group</p></div>`:""}`;
  act.innerHTML=exit?"":`<button class="btn ghost" id="again" style="background:var(--bg)">Passer au quiz de fin de formation</button>`;
  if(!exit)$("#again").onclick=()=>{S.moment="Fin de formation";S.step="intro";S.answers=[];S.obj=[];S.sent=null;save();render()};
}
render();
</script>

</body>
